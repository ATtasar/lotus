name: Windows desktop package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
          architecture: x64
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install build and test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix tests --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build desktop EXE, ZIP and installer
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          python tools/build_windows.py
          exit $LASTEXITCODE
      - name: Desktop interaction test against frozen EXE
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:LOTUS_PYTHON=(Get-Command python).Source
          $version=(Get-Content VERSION -Raw).Trim()
          $env:LOTUS_EXE=(Resolve-Path "dist/$version/Lotus/Lotus.exe").Path
          node tests/ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/preview-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/calendar-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/workbench-model.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/calendar-range.mjs
          exit $LASTEXITCODE
      - name: Verify frozen EXE
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $version=(Get-Content VERSION -Raw).Trim()
          python tools/check_release.py --exe "dist/$version/Lotus/Lotus.exe"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        with:
          name: lotus-windows
          path: |
            dist/**/*.zip
            dist/**/*setup*.exe
            dist/**/release.json
      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION differ.' }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Lotus $version" --notes-file RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $draft=gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($draft -ne 'true') { throw 'Published release assets are immutable. Increment VERSION instead of overwriting an existing release.' }
          }
          gh release upload $env:GITHUB_REF_NAME "dist/$version/lotus-$version-portable-win64.zip" "dist/$version/lotus-$version-setup-win64.exe" "dist/$version/release.json" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          exit $LASTEXITCODE
